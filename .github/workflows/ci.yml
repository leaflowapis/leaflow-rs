name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            generator
          cache-directories: .tools
      - name: Generate from the pinned contract
        run: |
          python3 scripts/generate.py
          git add -A
          git diff --cached --stat --exit-code
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked --workspace --no-default-features --features rest
      - run: cargo check --locked -p leaflow-fleet --no-default-features --features proto
